
name: Build Meu Personal APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Extrair projeto Android
        run: unzip -o android-project.zip -d .

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK de teste
        working-directory: android-project
        run: gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MeuPersonal-debug-apk
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
